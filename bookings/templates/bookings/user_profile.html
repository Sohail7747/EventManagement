{% extends "bookings/user_base.html" %}

{% block title %}Edit Profile | EventSphere{% endblock %}

{% block user_content %}

<div class="profile-main-header">
    <h1 class="profile-main-title">Edit Profile</h1>
    <p class="profile-main-subtitle">Update your personal details and how we can reach you.</p>
</div>

<div class="profile-form-card">
    <form method="post" action="{% url 'user-profile' %}" id="profileForm">
        {% csrf_token %}

        <!-- 2x2 Form Input Grid -->
        <div class="row g-4">

            <!-- FULL NAME -->
            <div class="col-12 col-md-6">
                <label for="id_full_name" class="field-label">FULL NAME</label>
                <input type="text"
                       id="id_full_name"
                       name="full_name"
                       class="form-control form-control-custom"
                       value="{{ user_full_name }}"
                       placeholder="Enter your full name"
                       maxlength="150"
                       required>
            </div>

            <!-- EMAIL ADDRESS -->
            <div class="col-12 col-md-6">
                <label for="id_email" class="field-label">EMAIL ADDRESS</label>
                <input type="email"
                       id="id_email"
                       name="email"
                       class="form-control form-control-custom"
                       value="{{ request.user.email }}"
                       placeholder="Enter your email address"
                       maxlength="254"
                       required>
            </div>

            <!-- MOBILE -->
            <div class="col-12 col-md-6">
                <label for="id_phone" class="field-label">MOBILE</label>
                <input type="text"
                       id="id_phone"
                       name="phone"
                       class="form-control form-control-custom"
                       value="{{ profile_phone }}"
                       placeholder="Enter your phone number"
                       required>
            </div>

            <!-- CITY -->
            <div class="col-12 col-md-6">
                <label for="id_city" class="field-label">CITY</label>
                <input type="text"
                       id="id_city"
                       name="city"
                       class="form-control form-control-custom"
                       value="{{ profile_city }}"
                       placeholder="Enter your city (e.g. Patna)"
                       maxlength="100">
            </div>

        </div>

        <!-- Action Submit Button -->
        <div class="d-flex justify-content-end mt-4 pt-2">
            <button type="submit" class="btn btn-save-changes">
                Save changes
            </button>
        </div>

    </form>
</div>

{% endblock %}
