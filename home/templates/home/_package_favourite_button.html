{% if can_favourite %}
<form
  method="post"
  action="{% url 'toggle-package-favourite' package.pk %}"
  class="package-favourite-form"
>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}" />
  <button
    type="submit"
    data-package-title="{{ package.title }}"
    aria-pressed="{% if package.pk in favourite_package_ids %}true{% else %}false{% endif %}"
    class="package-favourite-button{% if package.pk in favourite_package_ids %} is-favourite{% endif %}"
    title="{% if package.pk in favourite_package_ids %}Remove from favorites{% else %}Add to favorites{% endif %}"
    aria-label="{% if package.pk in favourite_package_ids %}Remove {{ package.title }} from favorites{% else %}Add {{ package.title }} to favorites{% endif %}"
  >
    <i
      class="bi {% if package.pk in favourite_package_ids %}bi-heart-fill{% else %}bi-heart{% endif %}"
      aria-hidden="true"
    ></i>
  </button>
</form>
{% elif not request.user.is_authenticated %}
<a
  href="{% url 'accounts-login-page' %}?next={{ request.get_full_path|urlencode }}"
  class="package-favourite-button"
  title="Log in to save this package"
  aria-label="Log in to save {{ package.title }}"
>
  <i class="bi bi-heart" aria-hidden="true"></i>
</a>
{% endif %}
